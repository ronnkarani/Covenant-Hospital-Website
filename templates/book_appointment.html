{% extends "base.html" %}
{% block title %}Book Appointment{% endblock %}

{% block content %}
<section class="book-appointment-section">
  <h2>Book an Appointment</h2>
  <form method="post">
    {% csrf_token %}

    <!-- Patient Info -->
    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" value="{{ patient.name|default:'' }}" required>
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" name="phone" value="{{ patient.phone|default:'' }}" required>
    </div>

    <div class="form-group">
      <label>Age</label>
      <input type="number" name="age" value="{{ patient.age|default:'' }}" required>
    </div>

    <div class="form-group">
  <label>Gender</label>
  <select name="gender" required>
    <option value="M" {% if patient.gender == "M" %}selected{% endif %}>Male</option>
    <option value="F" {% if patient.gender == "F" %}selected{% endif %}>Female</option>
  </select>
</div>


    <!-- Department & Doctor -->
    <div class="form-group">
      <label>Department</label>
      <select name="department" id="department-select" required>
        <option value="">Select Department</option>
        {% for dept in departments %}
          <option value="{{ dept.id }}">{{ dept.name }}</option>
        {% endfor %}
      </select>
    </div>

<div class="form-group">
  <label for="doctor-select">Doctor</label>
  <select name="doctor" id="doctor-select" required>
    <option value="">Select Doctor</option>
    {% for doc in doctors %}
      <option value="{{ doc.id }}" data-department="{{ doc.department.id }}">{{ doc.name }}</option>
    {% endfor %}
  </select>
</div>

    <div class="form-group">
  <label for="appointment_date">Select Date</label>
  <input type="date" name="appointment_date" id="appointment_date" required>
</div>


<div class="form-group">
  <label for="appointment_time">Select Time</label>
  <select name="appointment_time" id="appointment_time" required>
    <option value="">Select a time slot</option>
  </select>
</div>



    <!-- Issue Description -->
    <div class="form-group">
      <label>Brief Description of Issue</label>
      <textarea name="issue" rows="4" placeholder="Describe your issue..." required></textarea>
    </div>

    <button type="submit" class="btn-submit">Book Appointment</button>
  </form>
</section>


{% endblock %}
