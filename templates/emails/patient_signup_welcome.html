<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; color: #333; }
    .header { background: #800000; color: white; padding: 15px; text-align: center; }
    .content { padding: 20px; }
    .footer { margin-top: 30px; font-size: 12px; color: #777; text-align: center; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #800000;
      color: white !important;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://yourdomain.com/static/images/logo.png" alt="Covenant Hospital" height="50">
    <h2>Covenant Hospital</h2>
  </div>

  <div class="content">
    <p>Hello {{ username }},</p>

    <p>🎉 Welcome to <strong>Covenant Hospital</strong>!</p>

    <p>Your patient account has been created successfully.</p>

    <p><strong>Your Patient ID:</strong> {{ patient_id }}</p>

    <p>You can now log in to your account:</p>
    <a href="{{ login_url }}" class="btn">Login to Portal</a>
  </div>

  <div class="footer">
    &copy; {{ year }} Covenant Hospital. All rights reserved.
  </div>
</body>
</html>
