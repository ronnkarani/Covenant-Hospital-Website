<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #800000; padding: 20px; text-align: center; }
    .header img { max-height: 50px; }
    .content { padding: 30px; color: #333; }
    .content h2 { color: #800000; }
    .btn {
      display: inline-block;
      padding: 12px 25px;
      margin-top: 20px;
      background: #800000;
      color: #fff !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .footer { background: #f0f0f0; text-align: center; padding: 15px; font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://yourdomain.com/static/images/logo.png" alt="Covenant Hospital">
    </div>
    <div class="content">
      <h2>Hello Dr. {{ doctor_name }},</h2>
      <p>🎉 Good news! Your Covenant Hospital account has been approved.</p>

      <p><strong>Your Doctor ID:</strong> {{ doctor_id }}</p>

      <p>You can now log in to the hospital portal and start managing your appointments and patients.</p>

      <a href="{{ login_url }}" class="btn">Login to Portal</a>
    </div>
    <div class="footer">
      &copy; {{ year }} Covenant Hospital. All rights reserved.
    </div>
  </div>
</body>
</html>
